services:
  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: drf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для Celery
  redis:
    image: redis:7-alpine
    container_name: drf_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django приложение
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drf_web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
      "

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drf_celery
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --pool=solo

  # Celery Beat (периодические задачи)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drf_celery_beat
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - celery
    command: celery -A config beat -l info


# Тома для сохранения данных
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local