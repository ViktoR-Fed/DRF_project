name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==== JOB 1: Тесты ====
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          USER: test_user
          PASSWORD: test_password
          NAME: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env from template
      run: |
        # Копируем из правильной папки deploy/
        cp deploy/.env.template .env
        # Исправляем для тестов
        sed -i 's/HOST=db/HOST=localhost/g' .env
        sed -i 's/NAME=drf_db/NAME=test_db/g' .env
        sed -i 's/USER=drf_user/USER=test_user/g' .env
        sed -i 's/PASSWORD=drf_password/PASSWORD=test_password/g' .env
        sed -i 's/REDIS_HOST=redis/REDIS_HOST=localhost/g' .env
        sed -i 's/DEBUG=True/DEBUG=False/g' .env

    - name: Run migrations
      env:
        NAME: test_db
        USER: test_user
        PASSWORD: test_password
        HOST: localhost
        PORT: 5432
      run: |
        python manage.py makemigrations
        python manage.py migrate

    - name: Run tests
      env:
        NAME: test_db
        USER: test_user
        PASSWORD: test_password
        HOST: localhost
        PORT: 5432
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        python manage.py test

    - name: Run flake8 (lint)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ==== JOB 2: Билд ====
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.prod
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
          ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create deploy artifacts
      run: |
        mkdir -p deploy_files
        # Копируем файлы из правильных путей
        cp deploy/docker-compose.prod.yml deploy_files/
        # Убеждаемся, что default.conf - это файл, а не папка
        if [ -f deploy/nginx/default.conf ]; then
          cp deploy/nginx/default.conf deploy_files/
        else
          echo "Файл deploy/nginx/default.conf не найден, создаем..."
          cat > deploy_files/default.conf << 'EOF'
          upstream drf_app {
              server web:8000;
          }
          
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;
              
              location /static/ {
                  alias /app/staticfiles/;
                  expires 30d;
              }
              
              location /media/ {
                  alias /app/media/;
                  expires 30d;
              }
              
              location / {
                  proxy_pass http://drf_app;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_redirect off;
              }
          }
          EOF
        fi
        cp deploy/.env.template deploy_files/
        echo "${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}" > deploy_files/image_tag.txt

    - name: Upload deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-files
        path: deploy_files/
        retention-days: 1

  # ==== JOB 3: Деплой ====
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Download deploy files
      uses: actions/download-artifact@v4
      with:
        name: deploy-files
        path: deploy_files/

    - name: Read image tag
      id: read_tag
      run: |
        TAG=$(cat deploy_files/image_tag.txt)
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Создаем директории
          mkdir -p /app/drf_project/deploy/nginx
          cd /app/drf_project
          
          # Создаем .env с правильными переменными
          cat > .env << 'ENVEOF'
          # Django
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          # PostgreSQL 
          NAME=${{ secrets.POSTGRES_DB }}
          USER=${{ secrets.POSTGRES_USER }}
          PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          HOST=db
          PORT=5432
          
  
          # Redis
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DB=0
          
          # Celery 
          CELERY_BROKER_URL=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/0
          CELERY_RESULT_BACKEND=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/0
          
          # Stripe
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

          
          # Email
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
          
          YOUR_DOMAIN=${{ secrets.YOUR_DOMAIN }}
          ENVEOF
          
          # Создаем nginx конфиг
          cat > deploy/nginx/default.conf << 'NGINXEOF'
          upstream drf_app {
              server web:8000;
          }
          
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;
              
              location /static/ {
                  alias /app/staticfiles/;
                  expires 30d;
              }
              
              location /media/ {
                  alias /app/media/;
                  expires 30d;
              }
              
              location / {
                  proxy_pass http://drf_app;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_redirect off;
              }
          }
          NGINXEOF
          
          # Создаем docker-compose.yml
          cat > docker-compose.yml << 'DOCKEREOF'
          services:
            db:
              image: postgres:15-alpine
              container_name: drf_db
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5
          
            redis:
              image: redis:7-alpine
              container_name: drf_redis
              restart: unless-stopped
              command: redis-server --requirepass ${{ secrets.REDIS_PASSWORD }}
              volumes:
                - redis_data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "-a", "${{ secrets.REDIS_PASSWORD }}", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5
          
            web:
              image: ${{ steps.read_tag.outputs.tag }}
              container_name: drf_web
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - static_volume:/app/staticfiles
                - media_volume:/app/media
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              command: >
                sh -c "
                  python manage.py migrate &&
                  python manage.py collectstatic --noinput &&
                  gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
                "
          
            celery:
              image: ${{ steps.read_tag.outputs.tag }}
              container_name: drf_celery
              restart: unless-stopped
              env_file:
                - .env
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              command: celery -A config worker -l info --pool=solo
          
            celery-beat:
              image: ${{ steps.read_tag.outputs.tag }}
              container_name: drf_celery_beat
              restart: unless-stopped
              env_file:
                - .env
              depends_on:
                - redis
                - db
                - celery
              command: celery -A config beat -l info
          
            nginx:
              image: nginx:alpine
              container_name: drf_nginx
              restart: unless-stopped
              volumes:
                - static_volume:/app/staticfiles
                - media_volume:/app/media
                - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
              ports:
                - "80:80"
              depends_on:
                - web
          
          volumes:
            postgres_data:
            redis_data:
            static_volume:
            media_volume:
          DOCKEREOF
          
          # Останавливаем старые контейнеры
          docker-compose down
          
          # Запускаем новые
          docker-compose up -d
          
          # Очищаем старые образы
          docker image prune -f
          
          # Проверяем статус
          docker-compose ps