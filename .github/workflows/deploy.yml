name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==== JOB 1: Тесты ====
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment
      run: |
        cp .env.example .env
        sed -i 's/HOST=db/HOST=localhost/g' .env
        sed -i 's/REDIS_HOST=redis/REDIS_HOST=localhost/g' .env
        sed -i 's/DEBUG=True/DEBUG=False/g' .env

    - name: Run migrations
      run: |
        python manage.py makemigrations
        python manage.py migrate

    - name: Run tests
      run: |
        python manage.py test

    - name: Run flake8 (lint)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-reports/
          coverage.xml
        retention-days: 7

  # ==== JOB 2: Билд ====
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.prod
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/drf-project:latest
          ${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate deployment files
      run: |
        mkdir deploy_files
        cp deploy/docker-compose.prod.yml deploy_files/
        cp deploy/nginx/default.conf deploy_files/
        cp .env.template deploy_files/
        echo "DEPLOY_COMPOSE=${{ secrets.DOCKER_USERNAME }}/drf-project:${{ github.sha }}" > deploy_files/tag.txt

    - name: Upload deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-files
        path: deploy_files/
        retention-days: 1

  # ==== JOB 3: Деплой ====
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Download deploy files
      uses: actions/download-artifact@v4
      with:
        name: deploy-files
        path: deploy_files/

    - name: Read deploy tag
      id: read_tag
      run: |
        TAG=$(cat deploy_files/tag.txt | cut -d'=' -f2)
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Создаем директорию
          mkdir -p /app/drf_project
          cd /app/drf_project

          # Скачиваем файлы
          echo "Pulling Docker image: ${{ steps.read_tag.outputs.tag }}"
          docker pull ${{ steps.read_tag.outputs.tag }}
          
          # Обновляем docker-compose
          cat > docker-compose.yml << 'EOF'
          version: '3.8'
          services:
            web:
              image: ${{ steps.read_tag.outputs.tag }}
              container_name: drf_web
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - static_volume:/app/staticfiles
                - media_volume:/app/media
              depends_on:
                - db
                - redis
              command: >
                sh -c "
                  python manage.py migrate &&
                  python manage.py collectstatic --noinput &&
                  gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
                "

            celery:
              image: ${{ steps.read_tag.outputs.tag }}
              container_name: drf_celery
              restart: unless-stopped
              env_file:
                - .env
              depends_on:
                - db
                - redis
              command: celery -A config worker -l info --pool=solo

            celery-beat:
              image: ${{ steps.read_tag.outputs.tag }}
              container_name: drf_celery_beat
              restart: unless-stopped
              env_file:
                - .env
              depends_on:
                - redis
                - db
                - celery
              command: celery -A config beat -l info

            db:
              image: postgres:15-alpine
              container_name: drf_db
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - postgres_data:/var/lib/postgresql/data

            redis:
              image: redis:7-alpine
              container_name: drf_redis
              restart: unless-stopped
              command: redis-server --requirepass \${REDIS_PASSWORD}
              volumes:
                - redis_data:/data

            nginx:
              image: nginx:alpine
              container_name: drf_nginx
              restart: unless-stopped
              volumes:
                - static_volume:/app/staticfiles
                - media_volume:/app/media
                - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
              ports:
                - "80:80"
              depends_on:
                - web

          volumes:
            postgres_data:
            redis_data:
            static_volume:
            media_volume:
          EOF

          # Обновляем .env
          cat > .env << 'ENVEOF'
          # Django
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}

          # PostgreSQL
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          # Redis
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DB=0

          # Celery
          CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
          CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0

          # Stripe
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

          # Email
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}

          YOUR_DOMAIN=${{ secrets.YOUR_DOMAIN }}
          ENVEOF

          # Создаем директорию для nginx
          mkdir -p nginx
          cp deploy_files/default.conf nginx/

          # Останавливаем старые контейнеры
          docker-compose down

          # Запускаем новые контейнеры
          docker-compose up -d --build

          # Очищаем старые образы
          docker image prune -f

          # Проверяем статус
          docker-compose ps